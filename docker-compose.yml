version: '3.8'

services:
  hotel-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/hotel_catalog?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_create_hotels.sql:/docker-entrypoint-initdb.d/000001_create_hotels.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_catalog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
